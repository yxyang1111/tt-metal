  <text x="190.00" y="502.50" text-anchor="start" font-size="12" font-weight="500" fill="#9fb0c3" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><tspan x="190.00" dy="0">当前实验没有提供 per-core exact timestamp trace，</tspan><tspan x="190.00" dy="15">所以这里按实现顺序把 sender / tree / root 的主等待位置投影到同一张相对时间图；要点不是绝对时长，而是 `K` 供给与 `sender/tree` reduction backpressure 的闭环。</tspan></text>
